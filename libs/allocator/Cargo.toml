[package]
name = "allocator"
description = "the TLSF heap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# The counters are the profiler crate's; this forwards so a build that wants them
# sets one flag rather than learning where they live.
alloc_profiler = ["profiler/alloc_profiler"]
# The allocator's own audit mode: canaries around every block and a check of
# them on every free.  It is the feature the previous tree carried under the
# same name, and the code behind it is in the source either way: declaring it
# here is what tells cargo the gates exist rather than leaving them as
# conditions nothing can enable.
heap_audit = []

[dependencies]
# The counters, and the `static` holder.  Neither is a kernel type: a heap that
# needed one could not be the heap the kernel is built on.
profiler = { path = "../profiler" }
# The lock.  A heap is shared by every CPU and by interrupt handlers, so its
# critical section is the same problem `sync` already solves; a second
# implementation here was a third copy of the backoff and the interrupt
# save/restore, and one place to get that order wrong is enough.
sync = { path = "../sync" }
cell = { path = "../cell" }

[lints]
workspace = true
