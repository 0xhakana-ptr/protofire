[package]
name = "protofire"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = [
    "abi",
    "arch",
    "arch/x86_64",
    "arch/aarch64",
    "arch/riscv64",
    "async_io",
    "bootloader",
    "crypto",
    "drivers/block/virtio",
    "drivers/bus/pci",
    "drivers/net/e1000",
    "kernel",
    "libs/allocator",
    "libs/sync",
    "security",
    "sound",
    "syscall",
    "tools/xtask",
    "tests",
    "virt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Raiden Lumine"]
license = "Apache-2.0"

[workspace.dependencies]
abi = { path = "abi" }
async_io = { path = "async_io" }
sync = { path = "libs/sync" }
allocator = { path = "libs/allocator" }
arch = { path = "arch" }
security = { path = "security" }
syscall = { path = "syscall" }
sound = { path = "sound" }
virt = { path = "virt" }
kernel = { path = "kernel" }
spin = "0.9"
x86_64 = "0.15.2"
aarch64-cpu = "11.2.0"
riscv = "0.16.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
