[package]
name = "protofire"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = [
    "abi",
    "arch",
    "arch/x86_64",
    "arch/aarch64",
    "arch/riscv64",
    "async_io",
    "bootloader",
    "crypto",
    "drivers/block/virtio",
    "drivers/bus/pci",
    "drivers/net/e1000",
    "fs",
    "ipc",
    "kernel",
    "libs/allocator",
    "libs/audit",
    "block",
    "libs/cell",
    "libs/profiler",
    "libs/rights",
    "libs/sync",
    "libs/unicode",
    "memory",
    "net",
    "power",
    "security",
    "sound",
    "syscall",
    "tools/xtask",
    "tests",
    "virt",
    "apps/init",
    "apps/shell",
    "apps/service_manager",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Raiden Lumine"]
license = "Apache-2.0"

[workspace.dependencies]
abi = { path = "abi" }
async_io = { path = "async_io" }
sync = { path = "libs/sync" }
allocator = { path = "libs/allocator" }
security = { path = "security" }
syscall = { path = "syscall" }
sound = { path = "sound" }
spin = "0.9"
x86_64 = "0.15.2"
aarch64-cpu = "11.2.0"
riscv = "0.16.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }

# There is nothing to unwind to on bare metal, and the `no_std` image is built
# with this profile: a binary declared `no_main` cannot be built with the host's
# default `panic = "unwind"` at all ("unwinding panics are not supported without
# std").  The previous tree settles the same way for the same reason.
#
# `opt-level = 1` keeps a debug build fast enough to boot and small enough to
# read; `debug = 1` keeps file and line in a panic's `Location` and in a
# backtrace without the type and variable records that dominate a link.
[profile.dev]
panic = "abort"
opt-level = 1
debug = 1

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
