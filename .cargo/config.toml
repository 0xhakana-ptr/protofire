# File: .cargo/config.toml
# Purpose: Per-target linker scripts and rustflags for the bare-metal builds.

# The kernel is one image per machine, and each machine's loader expects a
# different container: x86_64 a multiboot2 ELF, aarch64 a raw Image with a
# 64-byte header, riscv64 an ELF whose entry OpenSBI jumps to.  The linker
# script is therefore selected by target here rather than by a `--config` flag
# on a command line, so a build that forgets it fails instead of producing an
# image at the wrong address.
#
# The script is named by the machine's own directory: where an image goes is a
# fact about the loader, so the script lives with the entry that reads the
# loader's conventions rather than with the protocol crate above it.
#
# `-C relocation-model=static` is not a style choice.  Without it the linker is
# invoked with `-pie` and the image comes out position-independent, which a
# multiboot2 loader placing it at a fixed address cannot use: the header's
# entry point would be an offset in a container the loader does not relocate.
# The previous tree settled on the same flag for the same reason.
#
# Nothing here passes `-nostartfiles`: that is a gcc driver flag and rust-lld
# rejects it outright (`unknown argument`).  A `no_std` binary has no crt to
# suppress in the first place; the entry symbol is `_start` in the assembly.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tarch/x86_64/linker-x86_64.ld",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tarch/aarch64/linker-aarch64.ld",
    # A raw binary, because QEMU's `-kernel` reads one: it loads the file's
    # bytes at the address it chose and jumps to the first.  An ELF would have
    # program headers and an entry point the loader does not read.
    "-C", "link-arg=--oformat=binary",
]

# ## Debugging this machine, which the flag above makes harder
#
# This is the only target that links a raw binary, and a raw binary has no
# symbol table: gdb attached to a stub can say "the core is at 0x40011234" and
# not which function that is.  The other two machines link ELF images, and
# QEMU reads their entry point, so their symbols are already there.
#
# To step through this one, link the same image again **without only this
# flag**, into a target directory of its own.  It must be its own directory:
# the same `cargo build` producing two different files in one directory makes
# the second run believe the first is current and skip the relink.
#
#     CARGO_TARGET_DIR=target-elf \
#     RUSTFLAGS="-C relocation-model=static -C link-arg=-Tarch/aarch64/linker-aarch64.ld" \
#         cargo build --offline -p bootloader --target aarch64-unknown-none
#
# Every other flag is the configuration above, so each address in the ELF names
# the instruction the running machine is at.  Boot the raw image with QEMU's
# `-s -S`, point gdb-multiarch at `target-elf/aarch64-unknown-none/debug/bootloader`,
# and `target remote :1234`.  `/target-elf/` is git-ignored for the reason the
# rules there give.

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tarch/riscv64/linker-riscv64.ld",
]

# ## The registry, from the tree instead of from crates.io
#
# 25 crates in `Cargo.lock` come from the registry, and every gate runs
# `cargo ... --offline`.  On a machine whose `~/.cargo` cache is warm those
# flags pass; on a clone that has never built this tree they fail at the first
# resolve, with `attempting to make an HTTP request, but --offline was
# specified`.  A competition or CI runner with no network is therefore a build
# that never starts, and the `--offline` in the gate was reading as a property
# of the build when it was a property of one machine's cache.
#
# `vendor/` is those crates' sources, produced by `cargo vendor --versioned-dirs
# vendor` and committed.  The two stanzas below are what makes cargo read them:
# every `crates.io` dependency is satisfied from the directory, so a fresh
# clone with an empty `CARGO_HOME` resolves and builds with no network at all.
#
# What this costs is 27 MiB and one directory of sources that nobody reads.
# What it buys is that `sh scripts/verify.sh p3` means the same thing on a
# machine that has never seen this tree, which is the only version of the gate
# a contributor can trust.  Re-run `cargo vendor --versioned-dirs vendor` and
# commit the result when a dependency changes; `cargo` names the crates whose
# checksums no longer match, and a vendor directory that disagrees with the
# lockfile fails the build rather than silently using the old sources.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
