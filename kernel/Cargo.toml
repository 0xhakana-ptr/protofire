[package]
name = "kernel"
description = "the core: scheduling, processes, address spaces, the syscalls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The two mutation hooks the controller carries, from the tree the driver was
# relocated out of: `xhci_ring_room_leak` stops the event ring's room from
# being handed back, so a gate can watch occupancy climb until `reserve`
# refuses, and `xhci_contention` makes the tick-drain line print every time
# rather than once, so a gate can read its position against the enumeration it
# explains.  Neither is enabled by any build this tree runs; they are here
# because a hook that needs a flag is a flag, not a comment.
[features]
xhci_ring_room_leak = []
xhci_contention = []

[dependencies]
abi.workspace = true
sync.workspace = true
allocator.workspace = true
spin.workspace = true
security.workspace = true
syscall.workspace = true

# No architecture feature: `arch` picks its implementation from the target, so
# `cargo build -p kernel --target <machine>` is the whole selection.  A feature
# on this side could disagree with the target, which is the state the previous
# manifest was in when it pinned `x86_64` in a path dependency and made the
# other two machines unbuildable from here.
arch = { path = "../arch" }
fs = { path = "../fs" }
block = { path = "../devices/block" }
# The page-table types and the walk arithmetic.  The kernel decides what its
# address space maps; `paging` is what a table is.
paging = { path = "../libs/paging" }
# Frames for page tables past the ones the boot reserves.  The allocator hands
# out pages before the heap exists, which is why its free list is a bitmap
# rather than a map: the same restriction that made this dependency necessary.
memory = { path = "../memory" }
# The pipe's ring buffer.  The arithmetic is the crate's; parking a task on an
# empty ring is this crate's, which is the split `scripts/layering.txt` argues.
ipc = { path = "../libs/ipc" }
# The handler table an interrupt is delivered through.
irq = { path = "../libs/irq" }
# The static holder for the page tables: a `static mut` would be the usual
# shape and this is the crate that replaces it.
cell = { path = "../libs/cell" }
# The bus, and the virtio framework over it.  The kernel is where a scan's
# policy lives: which bus, what is worth keeping, and what a machine without
# the device still does.
pci = { path = "../drivers/bus/pci" }
virtio_core = { path = "../drivers/virtio/core" }
virtio_block = { path = "../drivers/virtio/block" }
vga = { path = "../drivers/display/vga" }
text = { path = "../drivers/display/text" }
# The NVMe controller's wire format.  The registers, the two queue entries and
# the ring arithmetic are facts about a specification and are tested on a host;
# reaching the device is this crate's file, the same split `vga` and `framebuffer`
# make.
nvme = { path = "../drivers/storage/nvme" }
# The SATA controller's wire format, relocated out of the old tree's x86_64
# architecture crate.  The offsets, the three command structures and the
# identify structure are facts a host test holds; reaching the device is this
# crate's file, the same split `nvme` and `vga` make.
ahci = { path = "../drivers/storage/ahci" }
# The USB host controller's wire format, relocated out of the previous tree's
# drivers.  The register maps, the TRB and the USB structures are facts a host
# test holds; driving them is this crate's file, the same split the two disks
# make.
xhci = { path = "../drivers/usb/xhci" }
# The VirtIO input device, over the framework the two disks share.  The
# event's wire shape is the crate's; what an evdev key code means to this
# boot's console is this crate's file.
virtio_input = { path = "../drivers/virtio/input" }
# The VirtIO GPU's wire format: the control header, the command and
# response numbers, the 2D and 3D bodies, and the display-info answer.
# What it cannot hold is a device, which is what `virtio_gpu.rs` is.
virtio_gpu = { path = "../drivers/display/virtio_gpu" }
# The network card.  A boot with one exercises the frame path; a boot without
# one is the ordinary state on two of the three machines, and the driver prints
# nothing then.
virtio_net = { path = "../drivers/virtio/net" }
# The protocol stack above the frame, and the trait a card implements.  The
# kernel names both because it is what joins them: `net` never sees
# `virtio_net` and `virtio_net` never sees `net`, which is the whole reason
# `netdev` exists.
net = { path = "../net" }
netdev = { path = "../devices/netdev" }
async_io = { path = "../async_io" }
# The ciphers and hashes behind the random generator.  `crypto` is a layer-2
# tool: it names `core`, `alloc` and `abi`, and knows nothing of this crate or
# any other above it, which is what makes it something a kernel may use rather
# than something a kernel is shaped by.
crypto = { path = "../libs/crypto" }
