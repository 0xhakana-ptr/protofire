# rust-toolchain.toml
# Pinned Rust toolchain, components, and targets used by this repository.

[toolchain]
channel = "nightly-2026-11-02"
profile = "minimal"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none",
    "riscv64gc-unknown-none-elf",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
